display_name: AU Post Handoff Docs
short_description: >-
  Makes release handoff docs for approved AU Post cards. Builds a Support Guide and/or a
  Business Brief as Markdown and PDF, using the real Trello card details. Can send them
  to Slack when asked.
default_prompt: |
  Make the AU Post handoff document I asked for. Follow the aupost-handoff-docs skill.

  1. Make only the doc I asked for: Support Guide, Business Brief, or both. If you are not sure which one, ask me first.
  2. Make one combined doc for the whole release. Make a single-card doc only if I name one card.
  3. Read the full Trello card first: description, labels, comments, checklists, attachments, approved US/AC, test cases, and AI QA notes. Always read the QA comments, because important late notes are often only there.
  4. Get the steps right. Use the app navigation map and step templates in skills/aupost-handoff-docs/references/handoff_doc_formats.md, the AI QA evidence, or the app code — never the AC text, which almost never has the real screen steps. Use the exact button and link names, such as "AU Post Generate Label" and "Au Post Return Label" with that exact casing, and the settings route in the singular. If you cannot find the real steps, say so and ask, rather than making them up.
  5. Say which account type each card applies to: eParcel, MyPost Business, or both. This is the thing support gets wrong most often, so it goes on every card. Keep these limits exact: Extra Cover is $5,000 AUD on eParcel and $1,000 AUD on MyPost Business; international is eParcel only; Dangerous Goods is eParcel domestic only.
  6. Find the toggle for each card. Look everywhere in the card, not just the description: comments, checklists, attachments, the approved AC, the test cases, and the QA notes. The toggle name is often only in a comment. Put the exact toggle name in the index table, or `None` if the card needs no toggle. If a card has more than one toggle, list them all, separated by commas. Never guess a toggle name. The toggle finder in this repo can miss a name written in bold, so trust the card text and tell me when that happens.
  7. Check if support must look at a carrier request, response, or log. If yes, give the exact field name right after the step it belongs to, using the callout label `Request node to verify:` (or one of its variants), and say where to get the payload: the rates log during the label flow, or More Actions > Download Documents / How To > Click Here after the label exists. Skip this for UI-only, sync-only, report-only, and speed-only cards. If you cannot find the field name, say which log to open instead. Never make up a field name.
  8. Use the exact layout in skills/aupost-handoff-docs/references/handoff_doc_formats.md. The index table has four columns: `Story ID`, `Story Title`, `Toggle Name`, `Trello card link`. Each card section ends after Expected Behaviour. Do not bring back the sections we removed, including Release Details and Where to Find This in the App — the steps carry the navigation now. Account Type Coverage stays.
  9. Use no technical words in either doc. No code, no class or file names, no API or field jargon in the normal text, and no internal terms. Write it the way you would explain it to a person who has never seen the code. Write the Support Guide so a support person can explain the feature on a call. Keep the Business Brief short and safe for merchants, with no QA notes and no developer or tester names. The only places a technical string is allowed are the callout in rule 7, the Technical Cards section in rule 13, and toggle keys in the index table and the Toggles & Prerequisites table, which support and the dev team need exactly as written.
  10. Do not make up owners, release numbers, dates, toggles, account coverage, or limits. If something is missing, say so and still give me a usable draft.
  11. Save the Markdown in data/handoff_docs/. Then make the PDF with skills/aupost-handoff-docs/scripts/render_handoff_pdf.py. The PDF tool adds a page break before each card, so never add your own. Check that no card title is left alone at the bottom of a page.
  12. Send the doc to Slack only if I told you where to send it. Do a dry run first with scripts/send_handoff_pdf_to_slack.py, then send with --yes in the same reply. Tell me where it went and the file id, or the exact error. A yes for a DM is not a yes for a channel. The only send you may do without asking is the toggle list in rule 14, because I am asking for it here.
  13. Keep technical cards out of the main flow. A technical card is one that only a developer cares about, such as an API change, a library or version upgrade, a refactor, or an internal clean-up, with nothing for support or the merchant to see or do. Put every such card at the end of the doc, under one `## Technical Cards` heading placed after all the normal cards, with each card as a `### <Story ID> - <Card title>` entry so the short entries stay on one page. Keep those entries short: what changed and why it matters. Still list them in the index table in their normal place. If a card has both a technical part and something support can see, keep it as a normal card.
  14. After the doc is made, send the toggle list to Slack as a DM to ashok@pluginhive.com. Send only the consolidated list, not the doc. Skip this step if no card in the release has a toggle. Build the list with aupost-toggle-enable-list, one line per toggle, in this shape:
      `"<shop domain>.<toggle name>": true,`
      AU Post toggles are keyed by the merchant's Shopify store domain, including the `.myshopify.com` part, the same way FedEx does it. Use the shop the release was tested on, taken from the card or from me. There is no default store here, so ask me which shop if nothing names one — never invent one. If the release covers more than one shop, send one block per shop with a line saying which store it is for. If a card names a toggle with no shop in front of it, do not bolt a domain onto it; list it separately and say it is applied against the named shop directly. Show me the message before sending, then send it and tell me the result.
  15. Use the other skills instead of doing their work yourself: aupost-trello-operator to read cards and comments, aupost-slack-operator to send, aupost-domain-core to check current AU Post facts, aupost-toggle-enable-list to build the toggle list.
  16. Leave out any card carrying one of these labels: `SL: ON Hold`, `SL: Carrier Platform`, `Spill Over`, `SL: Closed By Support`. Match the label loosely, ignoring case and any emoji or prefix around it. These are Trello labels, not title text — an `SL:` prefix in a card title is a story id and never means "leave it out". Leave an excluded card out of the index table too, not just the body. Include such a card only if I name it or tell you to include it. Always list the cards you left out and the label that caused it, so I can see the release is short on purpose.

  At the end, tell me which docs you made, the full file paths, which account types are covered, whether the toggle list was sent, which cards you left out and why, what you assumed, and what was missing.
